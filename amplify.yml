version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "=== ENV VAR TEST ==="
        - echo "TEST_ENV_VAR exists = $(if [ -n \"$TEST_ENV_VAR\" ]; then echo YES; else echo NO; fi)"
        - echo "NEXT_PUBLIC_TEST exists = $(if [ -n \"$NEXT_PUBLIC_TEST\" ]; then echo YES; else echo NO; fi)"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
